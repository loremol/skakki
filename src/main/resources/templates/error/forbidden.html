<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Accesso negato', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Accesso negato</h1>
            <span class="mono dim">403</span>
        </div>
        <p class="sub" th:text="${errorMessage != null ? errorMessage : 'Non hai i permessi per fare questa operazione.'}"></p>

        <a th:href="@{/}" class="btn quiet">Torna ai tornei</a>

    </main>

</body>

</html>
