<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Operazione non consentita', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Operazione non consentita</h1>
            <span class="mono dim">409</span>
        </div>
        <p class="sub" th:text="${errorMessage != null ? errorMessage : 'L''operazione è in conflitto con lo stato attuale.'}"></p>

        <a th:href="@{/}" class="btn quiet">Torna ai tornei</a>

    </main>

</body>

</html>
