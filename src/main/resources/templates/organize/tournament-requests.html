<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Richieste', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <a class="back" th:href="@{/tournaments/{id}(id=${tournament.id})}"
            th:text="'‹ ' + ${tournament.name}"></a>

        <div class="head">
            <h1>Richieste</h1>
        </div>
        <p class="sub">Chi accetti entra in tabellone; puoi cambiare idea anche dopo.</p>

        <p class="note" th:if="${param.success}">Fatto.</p>

        <div class="split even">

            <div class="block">
                <h2>Iscrizioni</h2>
                <p class="dim" th:if="${#lists.isEmpty(signupRequests)}">Nessuna richiesta.</p>
                <table th:unless="${#lists.isEmpty(signupRequests)}">
                    <thead>
                        <tr>
                            <th>Socio</th>
                            <th>Chiesta il</th>
                            <th>Stato</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="request : ${signupRequests}">
                            <td><th:block th:replace="~{fragments/bits :: plink(${request.member})}"></th:block></td>
                            <td class="mono dim">
                                <th:block th:replace="~{fragments/bits :: day(${request.requestDate})}"></th:block>
                            </td>
                            <td><th:block th:replace="~{fragments/bits :: reqstatus(${request.status})}"></th:block>
                            </td>
                            <td>
                                <div class="row">
                                    <form th:if="${request.status.name() != 'ACCEPTED'}"
                                        th:action="@{/organize/tournament/{id}/accept-signup/{signupRequestId}(id=${tournament.id}, signupRequestId=${request.id})}"
                                        method="post">
                                        <button type="submit" class="btn">Accetta</button>
                                    </form>
                                    <form th:if="${request.status.name() != 'REJECTED'}"
                                        th:action="@{/organize/tournament/{id}/reject-signup/{signupRequestId}(id=${tournament.id}, signupRequestId=${request.id})}"
                                        method="post">
                                        <button type="submit" class="btn quiet">Rifiuta</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="block">
                <h2>Candidature ad arbitro</h2>
                <p class="dim" th:if="${#lists.isEmpty(arbiterApplications)}">Nessuna candidatura.</p>
                <table th:unless="${#lists.isEmpty(arbiterApplications)}">
                    <thead>
                        <tr>
                            <th>Socio</th>
                            <th>Chiesta il</th>
                            <th>Stato</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="app : ${arbiterApplications}">
                            <td><th:block th:replace="~{fragments/bits :: plink(${app.member})}"></th:block></td>
                            <td class="mono dim">
                                <th:block th:replace="~{fragments/bits :: day(${app.requestDate})}"></th:block>
                            </td>
                            <td><th:block th:replace="~{fragments/bits :: reqstatus(${app.status})}"></th:block></td>
                            <td>
                                <div class="row">
                                    <form th:if="${app.status.name() != 'ACCEPTED'}"
                                        th:action="@{/organize/tournament/{id}/accept-arbiter/{applicationId}(id=${tournament.id}, applicationId=${app.id})}"
                                        method="post">
                                        <button type="submit" class="btn">Accetta</button>
                                    </form>
                                    <form th:if="${app.status.name() != 'REJECTED'}"
                                        th:action="@{/organize/tournament/{id}/reject-arbiter/{applicationId}(id=${tournament.id}, applicationId=${app.id})}"
                                        method="post">
                                        <button type="submit" class="btn quiet">Rifiuta</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </main>

</body>

</html>
