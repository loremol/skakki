<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nuovo torneo', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Nuovo torneo</h1>
        </div>
        <p class="sub">Ne resti l'organizzatore: le iscrizioni e le candidature ad arbitro passeranno da te.</p>

        <p class="note" th:if="${param.success}">Torneo creato.</p>

        <form th:object="${newTournamentDto}" method="post" th:action="@{/organize/create-tournament}">

            <div class="fields">
                <div class="f">
                    <label for="name">Nome</label>
                    <input type="text" id="name" th:field="*{name}" required autocomplete="off" />
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="err"></span>
                </div>
                <div class="f">
                    <label for="location">Luogo</label>
                    <input type="text" id="location" th:field="*{location}" autocomplete="off" />
                    <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="err"></span>
                </div>
                <div class="f narrow">
                    <label for="numberOfRounds">Turni</label>
                    <input type="number" id="numberOfRounds" th:field="*{numberOfRounds}" min="1" />
                    <span th:if="${#fields.hasErrors('numberOfRounds')}" th:errors="*{numberOfRounds}"
                        class="err"></span>
                </div>
                <div class="f narrow">
                    <label for="registrationDeadline">Iscrizioni entro</label>
                    <input type="date" id="registrationDeadline" th:field="*{registrationDeadline}" />
                </div>
                <div class="f narrow">
                    <label for="startDate">Inizio</label>
                    <input type="date" id="startDate" th:field="*{startDate}" />
                </div>
                <div class="f narrow">
                    <label for="endDate">Fine</label>
                    <input type="date" id="endDate" th:field="*{endDate}" />
                </div>
                <div class="f wide">
                    <label for="description">Descrizione</label>
                    <textarea id="description" th:field="*{description}" autocomplete="off"></textarea>
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="err"></span>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn">Crea il torneo</button>
                <a th:href="@{/}" class="btn quiet">Annulla</a>
            </div>
        </form>

    </main>

</body>

</html>
