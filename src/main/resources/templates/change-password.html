<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cambia password', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">

        <nav class="breadcrumb">
            <a th:href="@{/}">Homepage</a>
            <span class="sep">/</span>
            <span>Cambia password</span>
        </nav>

        <h1>Cambia Password</h1>

        <div th:if="${success}" class="alert alert--ok">
            <p th:text="${success}"></p>
        </div>

        <div th:if="${error}" class="alert alert--err">
            <p th:text="${error}"></p>
        </div>

        <section class="card card--narrow">
            <form th:action="@{/change-password}" th:object="${changePasswordDto}" method="post" class="form-grid">
                <label for="oldPassword">Password attuale</label>
                <span>
                    <input type="password" id="oldPassword" th:field="*{oldPassword}" required />
                    <span th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"
                        class="alert alert--inline alert--err"></span>
                </span>

                <label for="newPassword">Nuova password</label>
                <span>
                    <input type="password" id="newPassword" th:field="*{newPassword}" required />
                    <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"
                        class="alert alert--inline alert--err"></span>
                </span>

                <label for="confirmPassword">Conferma nuova password</label>
                <span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                        class="alert alert--inline alert--err"></span>
                </span>

                <div class="form-submit actions">
                    <button type="submit" class="button">Cambia password</button>
                </div>
            </form>
        </section>

    </main>

</body>

</html>
