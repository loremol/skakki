<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cambia password', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <a class="back" th:href="@{/u/{id}(id=${@authenticationService.getLoggedInMember().id})}">‹ il tuo profilo</a>

        <div class="head">
            <h1>Cambia password</h1>
        </div>
        <p class="note" th:if="${success}" th:text="${success}"></p>
        <p class="note bad" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/change-password}" th:object="${changePasswordDto}" method="post">
            <div class="fields">
                <div class="f">
                    <label for="oldPassword">Password attuale</label>
                    <input type="password" id="oldPassword" th:field="*{oldPassword}"
                        autocomplete="current-password" required />
                    <span th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}" class="err"></span>
                </div>
                <div class="f">
                    <label for="newPassword">Nuova</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password"
                        required />
                    <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="err"></span>
                </div>
                <div class="f">
                    <label for="confirmPassword">Di nuovo</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                        autocomplete="new-password" required />
                    <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                        class="err"></span>
                </div>
            </div>
            <div class="row">
                <button type="submit" class="btn">Cambia</button>
            </div>
        </form>

    </main>

</body>

</html>
