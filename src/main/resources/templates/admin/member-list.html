<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Soci', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Soci</h1>
            <span class="dim" th:text="${#lists.size(members)} + ' iscritti'"></span>
        </div>

        <div class="row" style="margin:14px 0 18px">
            <input id="filtro" type="search" placeholder="cerca nome, username, provincia…"
                style="width:20rem" autocomplete="off">
            <a th:href="@{/admin/members/new}" class="btn">Nuovo socio</a>
        </div>

        <table id="soci">
            <thead>
                <tr>
                    <th>Socio</th>
                    <th>Ruoli</th>
                    <th>Provincia</th>
                    <th>Socio dal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member : ${members}">
                    <td>
                        <a th:href="@{/admin/members/{id}(id=${member.id})}"
                            th:text="${member.firstName != null ? member.firstName + ' ' + member.lastName : member.username}"></a>
                        <span th:if="${member.title != null}" th:text="${member.title}"></span>
                        <span class="sub-line">
                            <span class="pair"><span class="k">Username</span><th:block
                                    th:text="${member.username}"></th:block></span>
                            <span class="pair"><span class="k">Email</span><th:block
                                    th:text="${member.email}"></th:block></span>
                            <span class="pair" th:if="${member.fideId != null}"><span class="k">FIDE</span><th:block
                                    th:text="${member.fideId}"></th:block></span>
                            <span class="pair" th:if="${member.fsiId != null}"><span class="k">FSI</span><th:block
                                    th:text="${member.fsiId}"></th:block></span>
                            <span class="pair" th:if="${member.dateOfBirth != null}"><span class="k">Nato il</span>
                                <th:block th:replace="~{fragments/bits :: day(${member.dateOfBirth})}"></th:block>
                            </span>
                            <span class="pair" th:if="${member.gender != null}"><span class="k">Genere</span>
                                <th:block th:replace="~{fragments/bits :: gender(${member.gender})}"></th:block>
                            </span>
                        </span>
                    </td>
                    <td class="dim"><th:block th:replace="~{fragments/bits :: roles(${member.roles})}"></th:block></td>
                    <td>
                        <th:block th:text="${member.province}"></th:block>
                        <span class="sub-line" th:if="${member.countryCode != null}"
                            th:text="${member.countryCode}"></span>
                    </td>
                    <td class="mono dim">
                        <th:block th:replace="~{fragments/bits :: day(${member.signupDate})}"></th:block>
                    </td>
                </tr>
            </tbody>
        </table>

        <script>
            // la lista soci diventa lunga in fretta
            (function () {
                var box = document.getElementById('filtro');
                var righe = [].slice.call(document.querySelectorAll('#soci tbody tr'));
                box.addEventListener('input', function () {
                    var q = box.value.toLowerCase().trim();
                    righe.forEach(function (r) {
                        r.hidden = q !== '' && r.textContent.toLowerCase().indexOf(q) < 0;
                    });
                });
            })();
        </script>

    </main>

</body>

</html>
