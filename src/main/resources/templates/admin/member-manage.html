<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${member.username}, ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <a class="back" th:href="@{/admin/members}">‹ soci</a>

        <div class="head">
            <h1 th:text="${member.username}"></h1>
            <a class="dim" th:href="@{/u/{id}(id=${member.id})}">vedi il profilo pubblico</a>
        </div>
        <p class="sub">Socio dal <th:block th:replace="~{fragments/bits :: day(${member.signupDate})}"></th:block>.
        </p>

        <p class="note" th:if="${param.success}">Scheda aggiornata.</p>
        <p class="note bad" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form th:action="@{/admin/members/{id}(id=${member.id})}" th:object="${memberFields}" th:method="put">
            <input th:field="*{id}" type="hidden">

            <div class="block">
                <h2>Account</h2>
                <div class="fields">
                    <div class="f">
                        <label for="username">Username</label>
                        <input type="text" id="username" th:field="*{username}" />
                        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="err"></span>
                    </div>
                    <div class="f">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" />
                        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="err"></span>
                    </div>
                    <div class="f">
                        <label>Ruoli</label>
                        <div class="check">
                            <label th:each="role : ${roles}">
                                <input type="checkbox" th:field="*{roles}" th:value="${role.name()}" />
                                <span><th:block th:replace="~{fragments/bits :: role(${role})}"></th:block></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="block">
                <h2>Anagrafica</h2>
                <div class="fields">
                    <div class="f">
                        <label for="firstName">Nome</label>
                        <input type="text" id="firstName" th:field="*{firstName}" />
                        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="err"></span>
                    </div>
                    <div class="f">
                        <label for="lastName">Cognome</label>
                        <input type="text" id="lastName" th:field="*{lastName}" />
                        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="err"></span>
                    </div>
                    <div class="f narrow">
                        <label for="dateOfBirth">Nato il</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" />
                    </div>
                    <div class="f narrow">
                        <label for="gender">Genere</label>
                        <select id="gender" th:field="*{gender}">
                            <option value="" disabled hidden th:text="${member.gender}"></option>
                            <option th:each="gender : ${genders}" th:value="${gender}"
                                th:text="${gender.name() == 'MALE' ? 'Uomo' : 'Donna'}"></option>
                        </select>
                    </div>
                    <div class="f narrow">
                        <label for="province">Provincia</label>
                        <input type="text" id="province" th:field="*{province}" />
                        <span th:if="${#fields.hasErrors('province')}" th:errors="*{province}" class="err"></span>
                    </div>
                </div>
            </div>

            <div class="block">
                <h2>Scheda scacchistica</h2>
                <div class="fields">
                    <div class="f narrow">
                        <label for="fideId">ID FIDE</label>
                        <input type="number" id="fideId" th:field="*{fideId}" />
                        <span th:if="${#fields.hasErrors('fideId')}" th:errors="*{fideId}" class="err"></span>
                    </div>
                    <div class="f narrow">
                        <label for="fsiId">ID FSI</label>
                        <input type="number" id="fsiId" th:field="*{fsiId}" />
                        <span th:if="${#fields.hasErrors('fsiId')}" th:errors="*{fsiId}" class="err"></span>
                    </div>
                    <div class="f narrow">
                        <label for="countryCode">Paese</label>
                        <input type="text" id="countryCode" th:field="*{countryCode}" />
                        <span th:if="${#fields.hasErrors('countryCode')}" th:errors="*{countryCode}" class="err"></span>
                    </div>
                    <div class="f narrow">
                        <label for="title">Titolo</label>
                        <select id="title" th:field="*{title}">
                            <option value="" disabled hidden th:text="${member.title}"></option>
                            <option value="">Nessuno</option>
                            <option th:each="title : ${titles}" th:value="${title}" th:text="${title}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn">Salva</button>
                <a th:href="@{/admin/members}" class="btn quiet">Annulla</a>
            </div>
        </form>

        <form th:action="@{/admin/members/{id}(id=${member.id})}" th:method="delete" style="margin-top:26px">
            <button type="submit" class="btn bad"
                onclick="return confirm('Eliminare il socio? Non si torna indietro.')">Elimina il socio</button>
        </form>

    </main>

</body>

</html>
