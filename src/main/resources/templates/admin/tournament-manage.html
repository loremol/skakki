<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Modifica ' + ${tournament.name}, ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <a class="back" th:href="@{/tournaments/{id}(id=${tournament.id})}"
            th:text="'‹ ' + ${tournament.name}"></a>

        <div class="head">
            <h1>Modifica il torneo</h1>
        </div>
        <p class="sub">Organizzato da <th:block th:replace="~{fragments/bits :: pname(${tournament.organizer})}">
            </th:block>, che non si cambia da qui.</p>

        <p class="note" th:if="${param.success}">Torneo aggiornato.</p>

        <form th:action="@{/admin/tournaments/{id}(id=${tournament.id})}" th:object="${tournamentFields}"
            th:method="put">
            <input th:field="*{id}" type="hidden">

            <div class="fields">
                <div class="f">
                    <label for="name">Nome</label>
                    <input type="text" id="name" th:field="*{name}" />
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="err"></span>
                </div>
                <div class="f">
                    <label for="location">Luogo</label>
                    <input type="text" id="location" th:field="*{location}" />
                    <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="err"></span>
                </div>
                <div class="f narrow">
                    <label for="numberOfRounds">Turni</label>
                    <input type="number" id="numberOfRounds" th:field="*{numberOfRounds}" />
                    <span th:if="${#fields.hasErrors('numberOfRounds')}" th:errors="*{numberOfRounds}"
                        class="err"></span>
                </div>
                <div class="f narrow">
                    <label for="registrationDeadline">Iscrizioni entro</label>
                    <input type="date" id="registrationDeadline" th:field="*{registrationDeadline}" />
                </div>
                <div class="f narrow">
                    <label for="startDate">Inizio</label>
                    <input type="date" id="startDate" th:field="*{startDate}" />
                </div>
                <div class="f narrow">
                    <label for="endDate">Fine</label>
                    <input type="date" id="endDate" th:field="*{endDate}" />
                </div>
                <div class="f wide">
                    <label for="description">Descrizione</label>
                    <input type="text" id="description" th:field="*{description}" />
                    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="err"></span>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn">Salva</button>
                <a th:href="@{/tournaments/{id}(id=${tournament.id})}" class="btn quiet">Annulla</a>
            </div>
        </form>

        <form th:action="@{/admin/tournaments/{id}(id=${tournament.id})}" th:method="delete"
            style="margin-top:26px">
            <button type="submit" class="btn bad"
                onclick="return confirm('Eliminare il torneo? Non si torna indietro.')">Elimina il torneo</button>
        </form>

    </main>

</body>

</html>
