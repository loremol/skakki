<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Modifica dati torneo', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">

        <nav class="breadcrumb">
            <a th:href="@{/}">Homepage</a>
            <span class="sep">/</span>
            <span>Admin</span>
            <span class="sep">/</span>
            <a th:href="@{/tournaments}">Tornei</a>
            <span class="sep">/</span>
            <span th:text="${tournament.name}"></span>
        </nav>

        <h1>Modifica <span th:text="${tournament.name}"></span></h1>

        <div th:if="${param.success}" class="alert alert--ok">
            <p>Torneo aggiornato con successo.</p>
        </div>

        <form th:action="@{/admin/tournaments/{id}(id=${tournament.id})}" th:object="${tournamentFields}"
            th:method="put">
            <input th:field="*{id}" type="hidden">

            <section class="card">
                <h2>Dati torneo</h2>
                <div class="form-grid">
                    <label for="name">Nome</label>
                    <span>
                        <input type="text" id="name" th:field="*{name}" />
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                            class="alert alert--inline alert--err"></span>
                    </span>

                    <label for="description">Descrizione</label>
                    <span>
                        <input type="text" id="description" th:field="*{description}" />
                        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"
                            class="alert alert--inline alert--err"></span>
                    </span>

                    <label for="registrationDeadline">Scadenza registrazione</label>
                    <input type="date" id="registrationDeadline" th:field="*{registrationDeadline}" />

                    <label for="startDate">Data inizio</label>
                    <input type="date" id="startDate" th:field="*{startDate}" />

                    <label for="endDate">Data fine</label>
                    <input type="date" id="endDate" th:field="*{endDate}" />

                    <label for="location">Luogo</label>
                    <span>
                        <input type="text" id="location" th:field="*{location}" />
                        <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}"
                            class="alert alert--inline alert--err"></span>
                    </span>

                    <label for="numberOfRounds">Numero turni</label>
                    <span>
                        <input type="number" id="numberOfRounds" th:field="*{numberOfRounds}" />
                        <span th:if="${#fields.hasErrors('numberOfRounds')}" th:errors="*{numberOfRounds}"
                            class="alert alert--inline alert--err"></span>
                    </span>

                    <label>Organizzatore</label>
                    <input type="text" th:value="${tournament.organizer.username}" disabled readonly />
                </div>

                <div class="actions" style="margin-top:1rem">
                    <button type="submit" class="button">Aggiorna torneo</button>
                    <a th:href="@{/tournaments}" class="button button--ghost">Torna alla lista</a>
                </div>
            </section>


        </form>

        <form th:action="@{/admin/tournaments/{id}(id=${tournament.id})}" th:method="delete"
            style="margin-top:1rem">
            <button type="submit" class="button button--danger"
                onclick="return confirm('Eliminare il torneo ' + document.title + '? Questa operazione è irreversibile.')">Elimina
                torneo</button>
        </form>

    </main>

</body>

</html>
