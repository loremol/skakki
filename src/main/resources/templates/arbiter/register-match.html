<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Registra partita', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <a class="back" th:href="@{/tournaments/{id}(id=${tournament.id})}"
            th:text="'‹ ' + ${tournament.name}"></a>

        <div class="head">
            <h1>Registra una partita</h1>
        </div>
        <p class="sub">Per bye e forfait il risultato lo mette il sistema: lascia il campo vuoto.</p>

        <p class="note" th:if="${param.success}">Partita registrata.</p>

        <form th:object="${matchDto}" method="post"
            th:action="@{/tournaments/{id}/register-match(id=${tournament.id})}">

            <div class="fields">
                <div class="f narrow">
                    <label for="roundNumber">Turno</label>
                    <select id="roundNumber" th:field="*{roundNumber}" required>
                        <option value="">Scegli</option>
                        <option th:each="r : ${rounds}" th:value="${r.roundNumber}" th:text="${r.roundNumber}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('roundNumber')}" th:errors="*{roundNumber}" class="err"></span>
                </div>
                <div class="f">
                    <label for="whiteId">Bianco</label>
                    <select id="whiteId" th:field="*{whiteId}" required>
                        <option th:each="p : ${participants}" th:value="${p.id}"
                            th:text="${p.firstName != null ? p.firstName + ' ' + p.lastName : p.username}"></option>
                    </select>
                    <span th:if="${#fields.hasErrors('whiteId')}" th:errors="*{whiteId}" class="err"></span>
                </div>
                <div class="f">
                    <label for="blackId">Nero</label>
                    <select id="blackId" th:field="*{blackId}">
                        <option value="">Nessuno, è un bye</option>
                        <option th:each="p : ${participants}" th:value="${p.id}"
                            th:text="${p.firstName != null ? p.firstName + ' ' + p.lastName : p.username}"></option>
                    </select>
                </div>
                <div class="f">
                    <label for="matchType">Tipo</label>
                    <select id="matchType" th:field="*{matchType}">
                        <option th:each="t : ${matchTypes}" th:value="${t}"
                            th:text="${t.name() == 'BYE' ? 'Bye' : (t.name() == 'WHITE_FORFEIT' ? 'Forfait del bianco' : (t.name() == 'BLACK_FORFEIT' ? 'Forfait del nero' : 'Normale'))}">
                        </option>
                    </select>
                </div>
                <div class="f narrow">
                    <label for="result">Risultato</label>
                    <select id="result" th:field="*{result}">
                        <option value="">Automatico</option>
                        <option th:each="r : ${results}" th:value="${r}"
                            th:text="${r.name() == 'WHITE_WIN' ? '1-0' : (r.name() == 'BLACK_WIN' ? '0-1' : '½-½')}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('result')}" th:errors="*{result}" class="err"></span>
                </div>
                <div class="f wide">
                    <label for="pgn">Mosse in PGN</label>
                    <textarea id="pgn" th:field="*{pgn}" rows="8"
                        placeholder="1. e4 e5 2. Nf3 Nc6 3. Bb5 …"></textarea>
                    <span th:if="${#fields.hasErrors('pgn')}" th:errors="*{pgn}" class="err"></span>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="btn">Registra</button>
                <a th:href="@{/tournaments/{id}(id=${tournament.id})}" class="btn quiet">Annulla</a>
            </div>
        </form>

    </main>

</body>

</html>
