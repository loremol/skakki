<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Login', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="container">

        <nav class="breadcrumb">
            <a th:href="@{/}">Homepage</a>
            <span class="sep">/</span>
            <span>Login</span>
        </nav>

        <h1>Login</h1>

        <div th:if="${param.error}" class="alert alert--err">
            <p>Username o password non validi.</p>
        </div>
        <div th:if="${param.logout}" class="alert alert--ok">
            <p>Sei uscito con successo.</p>
        </div>

        <section class="card card--narrow">
            <form th:action="@{/login}" method="post" class="form-grid">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required />

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />

                <div class="form-submit actions">
                    <button type="submit" class="button">Accedi</button>
                    <a th:href="@{/register}" class="button button--ghost">Iscriviti</a>
                </div>
            </form>
        </section>

        <p class="muted"><a th:href="@{/register}">Non hai un account? Iscriviti</a></p>

    </main>

</body>

</html>
