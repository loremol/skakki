<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Entra', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Entra</h1>
        </div>
        <p class="sub">Serve l'account del club.</p>

        <p class="note bad" th:if="${param.error}">Username o password non validi.</p>
        <p class="note" th:if="${param.logout}">Sei uscito.</p>

        <form th:action="@{/login}" method="post">
            <div class="fields">
                <div class="f">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required />
                </div>
                <div class="f">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required />
                </div>
            </div>
            <div class="row">
                <button type="submit" class="btn">Entra</button>
                <span class="dim">oppure <a th:href="@{/register}">iscriviti al club</a></span>
            </div>
        </form>

    </main>

</body>

</html>
