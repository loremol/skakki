<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iscriviti al club', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Iscriviti al club</h1>
        </div>
        <p class="sub">Il resto della scheda (titolo, ID FIDE, provincia) lo compila la segreteria.</p>

        <p class="note" th:if="${param.success}">Registrazione fatta, ora puoi entrare.</p>

        <form th:action="@{/register}" th:object="${registrationDto}" method="post">
            <div class="fields">
                <div class="f">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" required />
                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="err"></span>
                </div>
                <div class="f">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required />
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="err"></span>
                </div>
                <div class="f">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" autocomplete="new-password"
                        required />
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="err"></span>
                </div>
            </div>
            <div class="row">
                <button type="submit" class="btn">Iscriviti</button>
                <span class="dim">hai già un account? <a th:href="@{/login}">entra</a></span>
            </div>
        </form>

    </main>

</body>

</html>
