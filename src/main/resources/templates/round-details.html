<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Turno ' + ${round.roundNumber}, ~{})}">
</head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <a class="back" th:href="@{/tournaments/{id}(id=${tournament.id})}"
            th:text="'‹ ' + ${tournament.name}"></a>

        <div class="head">
            <h1 th:text="'Turno ' + ${round.roundNumber}"></h1>
            <span class="mono dim" th:if="${round.playDate != null}">
                <th:block th:replace="~{fragments/bits :: day(${round.playDate})}"></th:block>
            </span>
            <span class="dim" th:if="${round.playDate == null}">data da fissare</span>
        </div>
        <p class="note" th:if="${param.success}">Turno aggiornato.</p>

        <div th:class="${isArbiter} ? 'split' : ''">

            <div class="block">
                <h2>Partite</h2>
                <p class="dim" th:if="${#lists.isEmpty(matches)}">Nessuna partita registrata in questo turno.</p>
                <table class="pairings" th:unless="${#lists.isEmpty(matches)}">
                    <tbody>
                        <tr th:each="match, i : ${matches}">
                            <td class="board-no" th:text="${i.count}"></td>
                            <td><th:block th:replace="~{fragments/bits :: plink(${match.white})}"></th:block></td>
                            <td class="num">
                                <a th:href="@{/matches/{matchId}(matchId=${match.id})}">
                                    <th:block th:replace="~{fragments/bits :: result(${match})}"></th:block>
                                </a>
                            </td>
                            <td>
                                <th:block th:if="${match.black != null}">
                                    <th:block th:replace="~{fragments/bits :: plink(${match.black})}"></th:block>
                                </th:block>
                                <span th:if="${match.black == null}" class="dim">Nessun avversario</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <aside class="side" th:if="${isArbiter}">
                <div class="block">
                    <h2>Da arbitro</h2>
                    <form th:action="@{/tournaments/{id}/rounds/{roundId}(id=${tournament.id}, roundId=${round.id})}"
                        th:method="put" class="row">
                        <input type="date" name="playDate" th:value="${round.playDate}" style="width:9.5rem" />
                        <button type="submit" class="btn quiet">Sposta</button>
                    </form>
                    <form th:action="@{/tournaments/{id}/rounds/{roundId}(id=${tournament.id}, roundId=${round.id})}"
                        th:method="delete" style="margin-top:10px">
                        <button type="submit" class="btn bad"
                            onclick="return confirm('Eliminare il turno? Non si torna indietro.')">Elimina il
                            turno</button>
                    </form>
                </div>
            </aside>

        </div>

    </main>

</body>

</html>
