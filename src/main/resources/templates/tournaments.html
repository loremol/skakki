<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Tornei del club', ~{})}"></head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page">

        <div class="head">
            <h1>Tornei del club</h1>
        </div>
        <p class="sub"
            th:text="${#lists.size(tournaments) == 1 ? 'un torneo in archivio' : #lists.size(tournaments) + ' tornei in archivio'}">
        </p>

        <p class="dim" th:if="${#lists.isEmpty(tournaments)}">Non c'è ancora nessun torneo.</p>
        <th:block th:unless="${#lists.isEmpty(tournaments)}">
            <th:block th:replace="~{fragments/bits :: tlist(${tournaments})}"></th:block>
        </th:block>

    </main>

</body>

</html>
