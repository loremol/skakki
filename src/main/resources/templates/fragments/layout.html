<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title, extraHead)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">skakki</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%233f6b4f'/><rect x='8' width='8' height='8' fill='%23fbfbfa'/><rect y='8' width='8' height='8' fill='%23fbfbfa'/></svg>">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="${extraHead}"></th:block>
</head>

<body>

    <header class="topbar" th:fragment="header">
        <div>
            <a th:href="@{/}" class="brand">skakki</a>
            <a sec:authorize="hasRole('ORGANIZER')" th:href="@{/organize/create-tournament}">nuovo torneo</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/members}">soci</a>
            <span class="right" sec:authorize="isAuthenticated()">
                <a th:href="@{/u/{id}(id=${@authenticationService.getLoggedInMember().id})}"
                    sec:authentication="name"></a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="linkbtn">esci</button>
                </form>
            </span>
        </div>
    </header>

</body>

</html>
