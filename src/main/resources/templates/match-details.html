<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Partita', ~{::extraHead})}">
    <th:block th:fragment="extraHead">
        <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
            crossorigin="anonymous">
    </th:block>
</head>

<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page" th:with="haPgn=${match.pgn != null and !match.pgn.isEmpty()}">

        <a class="back"
            th:href="@{/tournaments/{id}/rounds/{roundId}(id=${tournament.id}, roundId=${match.round.id})}"
            th:text="'‹ ' + ${tournament.name} + ', turno ' + ${match.round.roundNumber}"></a>

        <div class="head">
            <h1>
                <th:block th:replace="~{fragments/bits :: pname(${match.white})}"></th:block>
                <span class="dim">-</span>
                <th:block th:if="${match.black != null}">
                    <th:block th:replace="~{fragments/bits :: pname(${match.black})}"></th:block>
                </th:block>
                <span th:if="${match.black == null}" class="dim">riposo</span>
            </h1>
        </div>

        <div class="sub inline-facts">
            <span>
                <span class="k">Tipo</span>
                <span><th:block th:replace="~{fragments/bits :: mtype(${match.matchType})}"></th:block></span>
            </span>
            <span th:if="${match.round.playDate != null}">
                <span class="k">Giocata il</span>
                <span class="mono"><th:block th:replace="~{fragments/bits :: day(${match.round.playDate})}"></th:block></span>
            </span>
        </div>

        <div th:class="${haPgn} ? 'split game' : ''">

            <div th:if="${haPgn}">
                <div id="board" class="board"></div>
                <div class="controls">
                    <button id="btn-start" type="button">&lt;&lt;</button>
                    <button id="btn-prev" type="button">&lt;</button>
                    <button id="btn-next" type="button">&gt;</button>
                    <button id="btn-end" type="button">&gt;&gt;</button>
                    <span id="move-label"></span>
                </div>
                <script th:inline="javascript">
                    var pgn = /*[[${match.pgn}]]*/ '';
                </script>
            </div>

            <div>

                <div class="block">
                    <h2>Esito</h2>
                    <div class="big-res">
                        <th:block th:replace="~{fragments/bits :: result(${match})}"></th:block>
                    </div>
                </div>

                <div class="block">
                    <h2>Tavolo</h2>
                    <table class="tavolo">
                        <tbody>
                            <tr>
                                <td class="dim" style="width:5rem">Bianco</td>
                                <td><th:block th:replace="~{fragments/bits :: plink(${match.white})}"></th:block></td>
                                <td class="num">
                                    <th:block th:replace="~{fragments/bits :: points(${match.whitePoints})}"></th:block>
                                </td>
                            </tr>
                            <tr>
                                <td class="dim">Nero</td>
                                <td>
                                    <th:block th:if="${match.black != null}">
                                        <th:block th:replace="~{fragments/bits :: plink(${match.black})}"></th:block>
                                    </th:block>
                                    <span th:if="${match.black == null}" class="dim">Nessun avversario</span>
                                </td>
                                <td class="num">
                                    <th:block th:replace="~{fragments/bits :: points(${match.blackPoints})}"></th:block>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="block" th:if="${haPgn}">
                    <h2>Notazione</h2>
                    <pre th:text="${match.pgn}"></pre>
                </div>
                <p class="dim" th:unless="${haPgn}">Le mosse non sono state trascritte.</p>

                <div class="row" th:if="${isArbiter}">
                    <a th:href="@{/matches/{id}/edit(id=${match.id})}" class="btn quiet">Correggi la partita</a>
                    <form th:action="@{/matches/{id}/delete(id=${match.id})}" th:method="delete">
                        <button type="submit" class="btn bad"
                            onclick="return confirm('Eliminare questa partita?')">Elimina</button>
                    </form>
                </div>

            </div>

        </div>

    </main>

    <th:block th:if="${match.pgn != null and !match.pgn.isEmpty()}">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
            crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"
            crossorigin="anonymous"></script>
        <script>
            (function () {
                var game = new Chess();
                game.load_pgn(pgn);
                var history = game.history({ verbose: true });

                var positions = [new Chess().fen()];
                var temp = new Chess();
                for (var i = 0; i < history.length; i++) {
                    temp.move(history[i]);
                    positions.push(temp.fen());
                }

                var at = positions.length - 1;
                var label = document.getElementById('move-label');

                var board = Chessboard('board', {
                    position: positions[at],
                    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
                });

                function show(i) {
                    at = Math.max(0, Math.min(positions.length - 1, i));
                    board.position(positions[at], false);
                    if (at === 0) {
                        label.textContent = 'Posizione iniziale';
                    } else {
                        var m = history[at - 1];
                        label.textContent = Math.ceil(at / 2) + (at % 2 === 1 ? '. ' : '... ') + m.san;
                    }
                }

                document.getElementById('btn-start').onclick = function () { show(0); };
                document.getElementById('btn-prev').onclick = function () { show(at - 1); };
                document.getElementById('btn-next').onclick = function () { show(at + 1); };
                document.getElementById('btn-end').onclick = function () { show(positions.length - 1); };

                // le frecce servono piu' dei bottoni quando si scorre una partita
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowLeft') { show(at - 1); }
                    else if (e.key === 'ArrowRight') { show(at + 1); }
                    else if (e.key === 'Home') { show(0); }
                    else if (e.key === 'End') { show(positions.length - 1); }
                    else { return; }
                    e.preventDefault();
                });

                show(at);
            })();
        </script>
    </th:block>

</body>

</html>
